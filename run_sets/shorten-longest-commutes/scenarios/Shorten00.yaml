scenario_id: Shorten00
description: "Shorten00 - Baseline (no HBW trip redistribution)"

# Points directly at bring-work-trips-closer-to-home's Closer00 raw output --
# not a folder of Shorten00's own. Both are the same unmodified, unrun-
# through-this-run_set baseline (same tdm_ref/model version, same
# pre-mode-choice pipeline), so this scenario is never executed; it exists
# only so `tdmruns import-manual-run --run-set shorten-longest-commutes
# --scenario Shorten00` can record a successful run here, giving
# Shorten01/02's `start_from_copy: Shorten00` a source to copy from within
# this run set (start_from_copy only resolves against runs recorded in the
# same run set -- see run_sets/bring-work-trips-closer-to-home/scenarios/
# Closer00.yaml for the overrides that were actually applied when this
# folder was produced).
manual_scenario_folder: "Scenarios/bring-work-trips-closer-to-home/Closer00"

variables:
  # portion of region-wide HBW trip volume, selected by distance across all
  # OD pairs (not per origin), that is redistributed from the longest trips
  # toward destinations near the regional median commute distance
  hbw_trip_redistribution_portion: 0
