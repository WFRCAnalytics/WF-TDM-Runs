scenario_id: v10.0-beta.2-2023-byu-ecoedpass
scenario_name: "BYU_EcoEdPass_Test"
description: >
  Sensitivity test: BYU's TAZ (TAZID 2966) is missing an ECOEDPASS value in
  the real TAZ shapefile, unlike U of U, UVU, Weber State, and SLCC (which
  have year values like 2000/2003/2005) -- so BYU-area trips never get the
  free/discounted transit fare the EcoEdPassZones/FreeFareZones lookup in
  05_Skim_Tran.s applies to those other schools. This scenario overrides
  TAZ_DBF to point at a local copy of the TAZ shapefile
  (run_sets/v10.0-beta.2/inputs/WFv1000_TAZ_byu_ecoedpass.*) with ECOEDPASS
  set to 2018 for TAZID 2966 -- to see how fixing it changes mode
  choice/transit outputs, before deciding whether to fix it upstream in the
  TDM itself.

  Seeded via start_from_copy from this run set's own v10.0-beta.2-2023
  (unmodified base year) run, resuming at STEP4_05 (05_Skim_Tran.s) since
  ECOEDPASS only affects the transit skim step onward -- trip generation,
  distribution, and the auto/transit-access-market steps before it (STEP0-3,
  STEP4_01-04) are unaffected and reused as-is from that run's raw folder.
  v10.0-beta.2-2023 itself is the unmodified-baseline comparison; no
  separate base scenario is needed.

use_baseline_scenario_name: false
baseline_control_center: "_ControlCenter - Base_2023.block"

driver_script: __HailMary_1Subfolder_resumable.s
start_at_label: STEP4_05

start_from_copy: v10.0-beta.2-2023
# Once this scenario has been seeded once, add lock_down_copy: true to stop
# re-copying v10.0-beta.2-2023's raw folder (tens of GB) on every retry --
# see CLAUDE.md's start_from_copy/lock_down_copy notes.

overrides:
  UserName: "Bill Hereth"
  UserCompany: "WFRC"
  RunDescription: "BYU EcoEdPass sensitivity test for v10.0-beta.2"
  ScenarioName: "Base-EcoEdPass"
  runId: "_"
  # Skip vizTool upload for this one-off sensitivity test -- the sibling
  # v10.0-beta.2-2023/2036/2046/2055 scenarios all share ScenarioName "Base"
  # for vizTool, and this scenario isn't meant to land in that same catalog.
  Run_vizTool: 1
  vizToolDir: 'M:\GitHub\WF-TDM-Runs\runs\v10.0-beta.2\.vizTool'
  # Points at the local copy with BYU's ECOEDPASS fixed, instead of the
  # real tdm/1_Inputs/1_TAZ/WFv1000_TAZ.dbf -- tdm/ itself is never
  # modified. Three '..\' climb from tdm/1_Inputs/1_TAZ/ back out to the
  # WF-TDM-Runs repo root, same relative-navigation trick used for
  # non-motorized-2023's WFRC_SEFile/MAG_SEFile overrides (see CLAUDE.md).
  # Single-quoted so the backslashes are literal, not YAML escapes.
  TAZ_DBF: '..\..\..\run_sets\v10.0-beta.2\inputs\WFv1000_TAZ_byu_ecoedpass.dbf'

outputs:
  include:
    - datafile: "5_AssignHwy/4_Summaries/*Summary_SEGID.csv"
      columns: [SEGID, DISTANCE, DIRECTION, FUNCGROUP, SUBAREAID, CO_FIPS, LANES, LANEMILES, FTCLASS, CAP1HL, AM_Vol, MD_Vol, PM_Vol, EV_Vol, DY_Vol, FF_Spd, AM_Spd, MD_Spd, PM_Spd, EV_Spd, DY_Spd, FF_Tme, AM_Tme, MD_Tme, PM_Tme, EV_Tme, AM_CAP, MD_CAP, PM_CAP, EV_CAP, DY_CAP, AM_VC, MD_VC, PM_VC, EV_VC, MAX_VC, AM_VMT, MD_VMT, PM_VMT, EV_VMT, DY_VMT, AM_VMT_PC, MD_VMT_PC, PM_VMT_PC, EV_VMT_PC, DY_VMT_PC, AM_VMT_LT, MD_VMT_LT, PM_VMT_LT, EV_VMT_LT, DY_VMT_LT, AM_VMT_MD, MD_VMT_MD, PM_VMT_MD, EV_VMT_MD, DY_VMT_MD, AM_VMT_HV, MD_VMT_HV, PM_VMT_HV, EV_VMT_HV, DY_VMT_HV, FF_VHT, AM_VHT, MD_VHT, PM_VHT, EV_VHT, DY_VHT, AM_VHD, MD_VHD, PM_VHD, EV_VHD, DY_VHD]
    - datafile: "4_ModeChoice/4_Shares/*RegionShares_Pk.csv"
    - datafile: "4_ModeChoice/4_Shares/*RegionShares_Ok.csv"
    - datafile: "4_ModeChoice/3_TransitAssign/*transit_brding_summary_node.csv"
    - datafile: "4_ModeChoice/3_TransitAssign/*transit_brding_summary_route.csv"
    - datafile: "4_ModeChoice/3_TransitAssign/*transit_brding_summary_mode.csv"

  max_file_size_mb: 95
