#========================================================================================
# run_sets/tdm-2-moves-factors/run_set.yaml
#========================================================================================
run_set_id: tdm-2-moves-factors
author: "Bill Hereth"
description: "Compute TDM2MOVES VMT seasonal-factor summaries from an already-completed v10.0-beta.2 run, without re-running the model."


# v10.0.0-beta.2 lacks pp_Compute_AWDT_Seasonal_Factors.py and FactorTables.csv
# (01_Calculate_Factors_VMT.s needs both) -- this tag marks the v10x commit
# that has them, picked deliberately over the moving v10x branch tip so this
# run set doesn't drift under a later sync-tdm.
tdm_ref: "runs/tdm-2-moves-factors"

# This TDM version's network file requires the newer Bentley CUBE 25.01.01
voyager_exe: "C:\\Program Files\\Bentley\\OpenPaths\\CUBE 25.01.01\\Voyager\\Voyager.exe"

outputs:
  include:
    - datafile: "7_PostProcessing/5_TDM2MOVES_Prep/*_Assigned_Summary.dbf"
    - datafile: "7_PostProcessing/5_TDM2MOVES_Prep/*TDM_SummarywithFactors.dbf"

  max_file_size_mb: 95
