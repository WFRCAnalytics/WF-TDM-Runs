#========================================================================================
# run_sets/shorten-lengthen-all-work-trips/run_set.yaml
#========================================================================================
run_set_id: shorten-lengthen-all-work-trips
author: "Bill Hereth"
description: >
  Sketch-level test of a uniform, region-wide shift in HBW (home-based-work)
  trip length. For every origin zone with existing HBW trips, that origin's
  own trip-volume-weighted average commute distance is shifted by a fixed
  target percentage (-10%/-5%/0%/+5%/+10%), reweighting only its existing
  destination pattern (favoring closer destinations to shorten, farther ones
  to lengthen) -- never routing trips to a destination with zero existing
  trips from that origin. Applied before mode choice, against a no-shift 0%
  baseline. Unlike the companion run sets (a named-geography pull, or a
  region-wide longest-trips trim), this shifts the mean commute length of
  every origin simultaneously, across the full range of trip volume, not a
  selected subset. 2027 RTP adoption year, model v10.0.0-beta.1 (updated
  household/transit on-board survey data). Outputs: VMT, VHD, traffic
  volume, and transit/corridor effects vs. base.

tdm_ref: "v10.0.0-beta.1-closer-to-home"
baseline_control_center: "_ControlCenter - OY_2027.block"

# All four non-baseline scenarios (ShiftM10/ShiftM05/ShiftP05/ShiftP10) share
# this run set's one tdm_ref above, so `run-set` checks it out once and runs
# up to 2 of them at a time -- matches what's been manually confirmed to run
# fine as two simultaneous Cube Voyager instances on this machine (a
# per-machine, not per-seat, license). See CLAUDE.md's "same-ref scenarios
# now run concurrently" architecture note.
max_parallel_runs: 2

overrides:
  Run_Documentation: 0

outputs:
  include:
    # identical to bring-work-trips-closer-to-home / shorten-longest-commutes
    # -- same curated shapes so reports can reuse the same chart-building
    # functions
    - datafile: "4_ModeChoice/2_DetailedTripMatrices/*ZoneSummary_TripsByMode.csv"
      columns: [Purpose, Period, PA, TAZID, All, Auto, Bike, Moto, NonM, Walk, tTrn]
    - datafile: "4_ModeChoice/4_Shares/*Shares_Summary_long.csv"
    - datafile: "5_AssignHwy/4_Summaries/*Summary_SEGID.csv"
      columns: [SEGID, DISTANCE, DIRECTION, FUNCGROUP, SUBAREAID, CO_FIPS, LANES, LANEMILES, FTCLASS, CAP1HL, AM_Vol, MD_Vol, PM_Vol, EV_Vol, DY_Vol, FF_Spd, AM_Spd, MD_Spd, PM_Spd, EV_Spd, DY_Spd, FF_Tme, AM_Tme, MD_Tme, PM_Tme, EV_Tme, AM_CAP, MD_CAP, PM_CAP, EV_CAP, DY_CAP, AM_VC, MD_VC, PM_VC, EV_VC, MAX_VC, AM_VMT, MD_VMT, PM_VMT, EV_VMT, DY_VMT, AM_VMT_PC, MD_VMT_PC, PM_VMT_PC, EV_VMT_PC, DY_VMT_PC, AM_VMT_LT, MD_VMT_LT, PM_VMT_LT, EV_VMT_LT, DY_VMT_LT, AM_VMT_MD, MD_VMT_MD, PM_VMT_MD, EV_VMT_MD, DY_VMT_MD, AM_VMT_HV, MD_VMT_HV, PM_VMT_HV, EV_VMT_HV, DY_VMT_HV, FF_VHT, AM_VHT, MD_VHT, PM_VHT, EV_VHT, DY_VHT, AM_VHD, MD_VHD, PM_VHD, EV_VHD, DY_VHD]
    - datafile: "5_AssignHwy/4_Summaries/*TAZ-Based Metrics.csv"
      columns: [TAZID, Metric, Purpose, Period, PA, Total]
    - datafile: "4_ModeChoice/3_TransitAssign/*_transit_brding_summary_route.csv"
    - datafile: "0_InputProcessing/*SE_File.dbf"
    # Period-specific final skims and Peak/Off-Peak-split HBW trip matrices,
    # for the trip-length distribution's Peak/Off-Peak toggle -- see
    # bring-work-trips-closer-to-home/run_set.yaml's identical entries for
    # why (this run set curates the same shapes for the same reason).
    - matrix: "5_AssignHwy/5_FinalNetSkims/*Skm_AM.mtx"
      tabs: [GP_Dist]
    - matrix: "5_AssignHwy/5_FinalNetSkims/*Skm_MD.mtx"
      tabs: [GP_Dist]
    - matrix: "5_AssignHwy/5_FinalNetSkims/*Skm_PM.mtx"
      tabs: [GP_Dist]
    - matrix: "5_AssignHwy/5_FinalNetSkims/*Skm_EV.mtx"
      tabs: [GP_Dist]
    - matrix: "4_ModeChoice/2_DetailedTripMatrices/*HBW_trips_allsegs_Pk.mtx"
      tabs: [motor, nonmotor]
    - matrix: "4_ModeChoice/2_DetailedTripMatrices/*HBW_trips_allsegs_Ok.mtx"
      tabs: [motor, nonmotor]
  max_file_size_mb: 95
