#========================================================================================
# run_sets/household-location-burden/run_set.yaml
#========================================================================================
run_set_id: household-location-burden
author: "Bill Hereth"
description: >
  Proposal-stage study comparing the systemwide congested-VHT impact of
  adding the same number of households at different locations around the
  region, relative to a Murray (geographic-center) reference. See
  reports/run_sets/household-location-burden/proposal.qmd for the full
  methodology and open decisions -- only the base scenario exists so far.

tdm_ref: "runs/v10.0-beta.2"

# This TDM version's network file requires the newer Bentley CUBE 25.01.01
voyager_exe: "C:\\Program Files\\Bentley\\OpenPaths\\CUBE 25.01.01\\Voyager\\Voyager.exe"

# Same segment-level summary already curated for the v10.0-beta.2 run set --
# reused as-is for the base scenario. Once the Control/Test scenarios exist
# (custom driver_script enabling 4_BCA_Summaries/02_Summarize_HighwayNet.s),
# this will need a second include entry for that regionwide congestion-tier
# summary.
outputs:
  include:
    - datafile: "5_AssignHwy/4_Summaries/*Summary_SEGID.csv"
      columns: [SEGID, DISTANCE, DIRECTION, FUNCGROUP, SUBAREAID, CO_FIPS, LANES, LANEMILES, FTCLASS, CAP1HL, AM_Vol, MD_Vol, PM_Vol, EV_Vol, DY_Vol, FF_Spd, AM_Spd, MD_Spd, PM_Spd, EV_Spd, DY_Spd, FF_Tme, AM_Tme, MD_Tme, PM_Tme, EV_Tme, AM_CAP, MD_CAP, PM_CAP, EV_CAP, DY_CAP, AM_VC, MD_VC, PM_VC, EV_VC, MAX_VC, AM_VMT, MD_VMT, PM_VMT, EV_VMT, DY_VMT, AM_VMT_PC, MD_VMT_PC, PM_VMT_PC, EV_VMT_PC, DY_VMT_PC, AM_VMT_LT, MD_VMT_LT, PM_VMT_LT, EV_VMT_LT, DY_VMT_LT, AM_VMT_MD, MD_VMT_MD, PM_VMT_MD, EV_VMT_MD, DY_VMT_MD, AM_VMT_HV, MD_VMT_HV, PM_VMT_HV, EV_VMT_HV, DY_VMT_HV, FF_VHT, AM_VHT, MD_VHT, PM_VHT, EV_VHT, DY_VHT, AM_VHD, MD_VHD, PM_VHD, EV_VHD, DY_VHD]

  max_file_size_mb: 95
