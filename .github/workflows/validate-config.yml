name: Validate config

# Validates run_set/scenario config on every PR. Does not check out the TDM
# submodule's full history or run any model -- just enough of the submodule
# to read the Scenarios/_default/ baseline files referenced by run_set.yaml.
on:
  pull_request:
    paths:
      - "run_sets/**"
      - "config/**"
      - "src/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The TDM submodule (WF-TDM-Development) is a separate private repo;
          # the default GITHUB_TOKEN can't clone it, so TDM_SUBMODULE_PAT (a
          # fine-grained PAT with Contents:Read on both repos) stands in.
          token: ${{ secrets.TDM_SUBMODULE_PAT }}
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run tdmruns validate-config

      - name: Enforce repo-wide file size ceiling
        run: uv run python scripts/check_file_sizes.py
